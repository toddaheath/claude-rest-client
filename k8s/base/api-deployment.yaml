apiVersion: apps/v1
kind: Deployment
metadata:
  name: restward-api
  labels:
    app: restward-api
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: restward-api
  template:
    metadata:
      labels:
        app: restward-api
    spec:
      containers:
        - name: api
          image: restward-api:latest
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: restward-config
            - secretRef:
                name: restward-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
