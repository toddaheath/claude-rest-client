apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: restward-api-prod

resources:
  - namespace.yaml
  - ../../base

images:
  - name: restward-api
    newName: REPLACE_ACR.azurecr.io/restward-api
    newTag: prod-latest

patches:
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: restward-config
      data:
        ASPNETCORE_ENVIRONMENT: Production
        Cors__Origins__0: "https://strestwardspaprod.z13.web.core.windows.net"
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: restward-api
      spec:
        replicas: 2
        template:
          spec:
            containers:
              - name: api
                resources:
                  requests:
                    cpu: 250m
                    memory: 256Mi
                  limits:
                    cpu: "1"
                    memory: 1Gi
  - patch: |-
      apiVersion: v1
      kind: Secret
      metadata:
        name: restward-secrets
      stringData:
        POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
        ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=restward;Username=restward;Password=${POSTGRES_PASSWORD}"
        Jwt__Secret: "${JWT_SECRET_KEY}"
  - patch: |-
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: restward-api-ingress
      spec:
        tls:
          - hosts:
              - restward-api.heathrobotics.io
            secretName: restward-api-tls
        rules:
          - host: restward-api.heathrobotics.io
            http:
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: restward-api
                      port:
                        number: 80
  - patch: |-
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: postgres-data
      spec:
        resources:
          requests:
            storage: 5Gi
