services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: restward
      POSTGRES_PASSWORD: restward
      POSTGRES_DB: restward
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restward"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=restward;Username=restward;Password=restward"
      AdminApiKey: "dev-admin-key-for-local-development"
      Cors__Origins__0: "http://localhost"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  pgdata:
